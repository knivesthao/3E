name: ci

on:
  push:
    branches: [main, develop, local, codespace]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Detect Node project
        id: node
        run: |
          if [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.node.outputs.present == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        if: steps.node.outputs.present == 'true'
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Run tests
        if: steps.node.outputs.present == 'true'
        run: npm test --if-present

      - name: Typecheck
        if: steps.node.outputs.present == 'true'
        run: npm run typecheck --if-present

      - name: No Node project yet
        if: steps.node.outputs.present != 'true'
        run: echo "No package.json — app scaffold (Step 1) not yet committed. Nothing to test."

  # Branch strategy: develop -> development worker (demo + QA live here).
  # No production until funding: main is code-only, CI runs tests and stops.
  # Deploys run only on push (never on PRs) and only after tests pass.
  deploy-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx wrangler d1 migrations apply DB --remote --config api/wrangler.toml --env development
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: npx wrangler d1 migrations apply LIBRARY_DB --remote --config api/wrangler.toml --env development
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: npx wrangler deploy --config api/wrangler.toml --env development
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
